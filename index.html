<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAZZO | Calculadora Premium</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b0000">

<style>
@font-face{
    font-family:"TazzoFont";
    src:url("BringRace.woff2");
    font-display:swap;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

html, body{
    width:100%;
    min-height:100%;
    overflow-y:auto;
}

body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:linear-gradient(135deg,#180000,#8b0000,#1a0000);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
    padding:30px 15px;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* SPLASH */
.splash{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#180000,#8b0000,#1a0000);
    z-index:9999;
    overflow:hidden;
    animation:fadeOut 2.8s forwards;
    animation-delay:1.5s;
}

.splash-logo{
    font-family:"TazzoFont" !important;
    font-size:72px;
    display:flex;
    align-items:center;
    justify-content:center;
    white-space:nowrap;
    animation:zoomSplash 1.4s ease;
}

.splash-logo span{
    font-family:"TazzoFont" !important;
}

.logo{
    text-align:center;
    font-size:34px;
    margin-bottom:12px;
    white-space:nowrap;
}

.logo span{
    font-family:"TazzoFont" !important;
}

.white{
    color:white;
}

.red{
    color:#ff0000;
}

@keyframes zoomSplash{
    from{
        opacity:0;
        transform:scale(0.4);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes fadeOut{
    to{
        opacity:0;
        visibility:hidden;
    }
}

.app{
    width:100%;
    max-width:380px;
    backdrop-filter:blur(12px);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,0,0,0.25);
    box-shadow:0 0 25px rgba(255,0,0,0.2);
    border-radius:20px;
    padding:24px;
    margin:auto;
}

.subtitle{
    text-align:center;
    color:#eee;
    margin-bottom:18px;
    font-size:13px;
}

#installBtn{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#ff0000,#8b0000);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

label{
    display:block;
    color:white;
    margin-bottom:6px;
    font-size:13px;
}

input, select{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border:none;
    border-radius:12px;
    background:rgba(0,0,0,0.35);
    color:white;
    font-size:16px;
    text-align:center;
    outline:none;
}

.resultado{
    margin-top:16px;
    padding:18px;
    border-radius:14px;
    background:rgba(255,255,255,0.05);
}

.resultado h2{
    text-align:center;
    color:white;
    margin-bottom:10px;
    font-size:18px;
}

.linha{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
    font-size:16px;
}

.label{
    color:#ddd;
}

.valor{
    color:#ff3b3b;
    font-weight:bold;
}

@media (min-width:768px){
    .app{
        max-width:420px;
        padding:28px;
    }

    .logo{
        font-size:38px;
    }

    .splash-logo{
        font-size:90px;
    }
}
</style>
</head>
<body>

<div class="splash">
    <div class="splash-logo">
        <span class="white">TA</span><span class="red">ZZ</span><span class="white">O</span>
    </div>
</div>

<div class="app">
    <div class="logo">
        <span class="white">TA</span><span class="red">ZZ</span><span class="white">O</span>
    </div>

    <div class="subtitle">Calculadora Profissional de Diluição</div>

    <button id="installBtn">Instalar App</button>

    <label>Diluição</label>
    <input type="text" id="diluicao" placeholder="Ex: 1:20">

    <label>Volume</label>
    <input type="number" id="volume" placeholder="Ex: 2000">

    <label>Unidade</label>
    <select id="unidade">
        <option value="ml">Mililitros (ml)</option>
        <option value="l">Litros (L)</option>
    </select>

    <div class="resultado">
        <h2>Resultado</h2>
        <div class="linha">
            <span class="label">Produto</span>
            <span class="valor" id="produto">0 ml</span>
        </div>
        <div class="linha">
            <span class="label">Água</span>
            <span class="valor" id="agua">0 ml</span>
        </div>
    </div>
</div>

<script>
function calcular() {
    let dil = document.getElementById("diluicao").value.trim();
    let volume = parseFloat(document.getElementById("volume").value);
    let unidade = document.getElementById("unidade").value;

    if (!dil.includes(":") || isNaN(volume) || volume <= 0) {
        document.getElementById("produto").innerHTML = "0 ml";
        document.getElementById("agua").innerHTML = "0 ml";
        return;
    }

    if (unidade === "l") volume *= 1000;

    let divisor = parseFloat(dil.split(":")[1]);

    let produto = volume / divisor;
    let agua = volume - produto;

    document.getElementById("produto").innerHTML = produto.toFixed(1)+" ml";
    document.getElementById("agua").innerHTML = agua.toFixed(1)+" ml";
}

document.getElementById("diluicao").addEventListener("input", calcular);
document.getElementById("volume").addEventListener("input", calcular);
document.getElementById("unidade").addEventListener("change", calcular);

document.getElementById("installBtn").onclick = function(){
    alert("No iPhone: Compartilhar → Adicionar à Tela de Início");
};
</script>

</body>
</html>
