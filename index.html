<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAZZO | Calculadora Premium</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#8b0000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TAZZO">

<link href="https://fonts.cdnfonts.com/css/bring-race" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    background:linear-gradient(135deg,#180000,#8b0000,#1a0000);
    padding:30px 15px;
}

.app{
    width:100%;
    max-width:400px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,0,0,0.25);
    box-shadow:0 0 25px rgba(255,0,0,0.2);
    border-radius:20px;
    padding:24px;
}

.logo{
    font-size:34px;
    text-align:center;
    margin-bottom:16px;
}

.logo span{
    font-family:'Bring Race',sans-serif !important;
}

.white{color:white;}
.red{color:#ff0000;}

button{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#ff0000,#8b0000);
    color:white;
    font-size:16px;
    font-weight:bold;
}

.quick-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:14px;
}

.quick-buttons button{
    padding:10px;
    font-size:14px;
    margin:0;
}

input,select{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border:none;
    border-radius:12px;
    background:rgba(0,0,0,0.35);
    color:white;
    font-size:16px;
    text-align:center;
}

.resultado{
    margin-top:16px;
    padding:18px;
    border-radius:14px;
    background:linear-gradient(135deg,#4d0000,#8b0000);
}

.linha{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
    color:white;
}
</style>
</head>
<body>

<div class="app">
    <div class="logo">
        <span class="white">TA</span><span class="red">ZZ</span><span class="white">O</span>
    </div>

    <div class="quick-buttons">
        <button onclick="setDil('1:10')">1:10</button>
        <button onclick="setDil('1:20')">1:20</button>
        <button onclick="setDil('1:30')">1:30</button>
        <button onclick="setDil('1:50')">1:50</button>
    </div>

    <input type="text" id="diluicao" placeholder="Ex: 1:20">
    <input type="number" id="volume" placeholder="Ex: 2000">

    <select id="unidade">
        <option value="ml">Mililitros (ml)</option>
        <option value="l">Litros (L)</option>
    </select>

    <div class="resultado">
        <div class="linha">
            <span>Diluição</span>
            <span id="dilShow">-</span>
        </div>

        <div class="linha">
            <span>Produto</span>
            <span id="produto">0 ml</span>
        </div>

        <div class="linha">
            <span>Água</span>
            <span id="agua">0 ml</span>
        </div>

        <div class="linha">
            <span>Rendimento</span>
            <span id="rendimento">0 L</span>
        </div>
    </div>

    <button onclick="compartilharWhatsapp()">Compartilhar Imagem</button>
</div>

<script>
function setDil(valor){
    document.getElementById("diluicao").value = valor;
    calcular();
}

function calcular(){
    let dil = document.getElementById("diluicao").value.trim();
    let volume = parseFloat(document.getElementById("volume").value);
    let unidade = document.getElementById("unidade").value;

    if(!dil.includes(":") || isNaN(volume)) return;

    if(unidade==="l") volume*=1000;

    let divisor=parseFloat(dil.split(":")[1]);

    let produto=volume/divisor;
    let agua=volume-produto;
    let rendimento=(500/produto).toFixed(1);

    document.getElementById("dilShow").innerText=dil;
    document.getElementById("produto").innerText=produto.toFixed(1)+" ml";
    document.getElementById("agua").innerText=agua.toFixed(1)+" ml";
    document.getElementById("rendimento").innerText="500ml rende até "+rendimento+"L";
}

async function compartilharWhatsapp(){
    const dil = document.getElementById("dilShow").innerText;
    const produto = document.getElementById("produto").innerText;
    const agua = document.getElementById("agua").innerText;
    const rendimento = document.getElementById("rendimento").innerText;

    const story = document.createElement("div");

    story.style.width="1080px";
    story.style.height="1920px";
    story.style.position="fixed";
    story.style.left="-9999px";
    story.style.background="linear-gradient(180deg,#1a0000,#8b0000)";
    story.style.display="flex";
    story.style.justifyContent="center";
    story.style.alignItems="center";
    story.style.padding="80px";

    story.innerHTML=`
        <div style="
            width:100%;
            max-width:860px;
            border-radius:40px;
            padding:80px;
            background:rgba(255,255,255,0.06);
            border:2px solid rgba(255,255,255,0.12);
            box-shadow:0 0 60px rgba(255,0,0,0.25);
        ">

            <div style="text-align:center;margin-bottom:70px;">
                <svg width="600" height="120" viewBox="0 0 600 120">
                    <text x="50%" y="50%"
                          dominant-baseline="middle"
                          text-anchor="middle"
                          font-size="80"
                          font-family="Arial"
                          fill="white">TA</text>

                    <text x="320" y="60"
                          font-size="80"
                          font-family="Arial"
                          fill="red">ZZ</text>

                    <text x="430" y="60"
                          font-size="80"
                          font-family="Arial"
                          fill="white">O</text>
                </svg>
            </div>

            <div style="
                text-align:center;
                font-size:58px;
                color:white;
                margin-bottom:60px;
                font-weight:bold;
            ">
                RESULTADO DA DILUIÇÃO
            </div>

            <div style="
                display:grid;
                grid-template-columns:1fr 1fr;
                border:2px solid rgba(255,255,255,0.12);
                border-radius:24px;
                overflow:hidden;
            ">
                <div style="padding:45px;border-right:1px solid rgba(255,255,255,0.12);border-bottom:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:42px;">Diluição</div>
                <div style="padding:45px;border-bottom:1px solid rgba(255,255,255,0.12);color:white;font-size:42px;text-align:right;font-weight:bold;">${dil}</div>

                <div style="padding:45px;border-right:1px solid rgba(255,255,255,0.12);border-bottom:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:42px;">Produto</div>
                <div style="padding:45px;border-bottom:1px solid rgba(255,255,255,0.12);color:white;font-size:42px;text-align:right;font-weight:bold;">${produto}</div>

                <div style="padding:45px;border-right:1px solid rgba(255,255,255,0.12);border-bottom:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:42px;">Água</div>
                <div style="padding:45px;border-bottom:1px solid rgba(255,255,255,0.12);color:white;font-size:42px;text-align:right;font-weight:bold;">${agua}</div>

                <div style="padding:45px;border-right:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:42px;">Rendimento</div>
                <div style="padding:45px;color:white;font-size:42px;text-align:right;font-weight:bold;">${rendimento}</div>
            </div>
        </div>
    `;

    document.body.appendChild(story);

    const canvas=await html2canvas(story,{scale:1,useCORS:true});

    document.body.removeChild(story);

    canvas.toBlob(async function(blob){
        const file=new File([blob],"story-tazzo-premium.png",{type:"image/png"});

        if(navigator.canShare && navigator.canShare({files:[file]})){
            await navigator.share({files:[file]});
        }
    },"image/png");
}

document.getElementById("diluicao").addEventListener("input",calcular);
document.getElementById("volume").addEventListener("input",calcular);
document.getElementById("unidade").addEventListener("change",calcular);
</script>

</body>
</html>
