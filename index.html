<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAZZO | Calculadora Premium</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b0000">
<link href="https://fonts.cdnfonts.com/css/bring-race" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

html, body{
    width:100%;
    min-height:100%;
    overflow-y:auto;
}

body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:linear-gradient(135deg,#180000,#8b0000,#1a0000);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
    padding:30px 15px;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.splash{
    position:fixed;
    inset:0;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#180000,#8b0000,#1a0000);
    z-index:9999;
    animation:fadeOut 2.8s forwards;
    animation-delay:1.5s;
}

.splash-logo,
.logo{
    white-space:nowrap;
    text-align:center;
}

.splash-logo span,
.logo span{
    font-family:'Bring Race', sans-serif !important;
}

.splash-logo{
    font-size:72px;
    animation:zoomSplash 1.4s ease;
}

.logo{
    font-size:34px;
    margin-bottom:12px;
}

.red{
    color:#ff0000;
    text-shadow:0 0 6px #ff0000, 0 0 12px #ff0000;
    animation:glow 1.8s ease-in-out infinite alternate;
}

.white{
    color:white;
}

@keyframes glow{
    from{
        text-shadow:0 0 4px #ff0000;
    }
    to{
        text-shadow:0 0 14px #ff0000,0 0 24px #ff0000;
    }
}

@keyframes zoomSplash{
    from{
        opacity:0;
        transform:scale(0.4);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes fadeOut{
    to{
        opacity:0;
        visibility:hidden;
    }
}

.app{
    width:100%;
    max-width:400px;
    backdrop-filter:blur(12px);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,0,0,0.25);
    box-shadow:0 0 25px rgba(255,0,0,0.2);
    border-radius:20px;
    padding:24px;
    margin:auto;
}

.subtitle{
    text-align:center;
    color:#eee;
    margin-bottom:18px;
    font-size:13px;
}

button{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#ff0000,#8b0000);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.quick-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:14px;
}

.quick-buttons button{
    padding:10px;
    font-size:14px;
    margin:0;
}

label{
    display:block;
    color:white;
    margin-bottom:6px;
    font-size:13px;
}

input, select{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border:none;
    border-radius:12px;
    background:rgba(0,0,0,0.35);
    color:white;
    font-size:16px;
    text-align:center;
}

.resultado{
    margin-top:16px;
    padding:18px;
    border-radius:14px;
    background:rgba(255,255,255,0.05);
}

.resultado h2{
    text-align:center;
    color:white;
    margin-bottom:10px;
}

.linha{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
    font-size:16px;
}

.label{
    color:#ddd;
}

.valor{
    color:#ff3b3b;
    font-weight:bold;
}

.rendimento{
    margin-top:12px;
    color:white;
    text-align:center;
    font-size:14px;
}
</style>
</head>
<body>

<div class="splash">
    <div class="splash-logo">
        <span class="white">TA</span><span class="red">ZZ</span><span class="white">O</span>
    </div>
</div>

<div class="app">
    <div class="logo">
        <span class="white">TA</span><span class="red">ZZ</span><span class="white">O</span>
    </div>

    <div class="subtitle">Calculadora Profissional de Diluição</div>

    <!-- Atalhos de diluição -->
    <div class="quick-buttons">
        <button onclick="setDil('1:10')">1:10</button>
        <button onclick="setDil('1:20')">1:20</button>
        <button onclick="setDil('1:30')">1:30</button>
        <button onclick="setDil('1:50')">1:50</button>
    </div>

    <!-- Atalhos de volume -->
    <div class="quick-buttons">
        <button onclick="setVolume(500)">500ml</button>
        <button onclick="setVolume(1000)">1L</button>
        <button onclick="setVolume(2000)">2L</button>
        <button onclick="setVolume(5000)">5L</button>
    </div>

    <label>Diluição</label>
    <input type="text" id="diluicao" placeholder="Ex: 1:20">

    <label>Volume</label>
    <input type="number" id="volume" placeholder="Ex: 2000">

    <label>Unidade</label>
    <select id="unidade">
        <option value="ml">Mililitros (ml)</option>
        <option value="l">Litros (L)</option>
    </select>

    <div class="resultado">
        <h2>Resultado</h2>
        <div class="linha">
            <span class="label">Produto</span>
            <span class="valor" id="produto">0 ml</span>
        </div>
        <div class="linha">
            <span class="label">Água</span>
            <span class="valor" id="agua">0 ml</span>
        </div>

        <div class="rendimento" id="rendimento">
            Rendimento: 0 L
        </div>
    </div>

    <button onclick="compartilharWhatsapp()">Compartilhar no WhatsApp</button>
</div>

<script>
function setDil(valor){
    document.getElementById("diluicao").value = valor;
    calcular();
}

function setVolume(valor){
    document.getElementById("volume").value = valor;
    document.getElementById("unidade").value = "ml";
    calcular();
}

function calcular() {
    let dil = document.getElementById("diluicao").value.trim();
    let volume = parseFloat(document.getElementById("volume").value);
    let unidade = document.getElementById("unidade").value;

    if (!dil.includes(":") || isNaN(volume) || volume <= 0) {
        return;
    }

    if (unidade === "l") volume *= 1000;

    let divisor = parseFloat(dil.split(":")[1]);

    let produto = volume / divisor;
    let agua = volume - produto;

    let rendimento = (500 / produto).toFixed(1);

    document.getElementById("produto").innerHTML = produto.toFixed(1)+" ml";
    document.getElementById("agua").innerHTML = agua.toFixed(1)+" ml";
    document.getElementById("rendimento").innerHTML =
        "500ml rende até " + rendimento + "L";
}

function compartilharWhatsapp(){
    let produto = document.getElementById("produto").innerText;
    let agua = document.getElementById("agua").innerText;
    let dil = document.getElementById("diluicao").value;

    let texto = encodeURIComponent(
        "TAZZO - Resultado da Diluição\n" +
        "Diluição: " + dil + "\n" +
        "Produto: " + produto + "\n" +
        "Água: " + agua
    );

    window.open("https://wa.me/?text=" + texto, "_blank");
}

document.getElementById("diluicao").addEventListener("input", calcular);
document.getElementById("volume").addEventListener("input", calcular);
document.getElementById("unidade").addEventListener("change", calcular);
</script>

</body>
</html>
